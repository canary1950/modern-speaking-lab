<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="英語の音声を文字起こしし、英文添削・発音・学習アドバイスをAIで分析します。">
  <title>Modern Speaking Lab | AI英語スピーキング分析</title>
  <style>:root{--bg:#071426;--panel:#10233f;--line:rgba(148,163,184,.18);--cyan:#22d3ee;--lav:#a78bfa;--mint:#34d399;--amber:#fbbf24;--text:#f8fafc;--muted:#a8b6cc}
*{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at 48% 22%,#0b2140 0,#071426 48%,#04101f 100%);color:var(--text);font-family:Inter,"Noto Sans JP",system-ui,sans-serif;min-height:100vh} button,input{font:inherit} button{color:inherit}
.topbar{height:76px;padding:0 28px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;background:rgba(4,16,31,.72);backdrop-filter:blur(12px)}.brand{display:flex;align-items:center;gap:14px}.logo{width:48px;height:38px;border:2px solid var(--cyan);border-radius:14px;display:grid;place-items:center;color:var(--cyan);font-size:24px;box-shadow:0 0 24px #22d3ee33}.brand h1{font-size:23px;margin:0;letter-spacing:.01em}.brand p{font-size:12px;color:var(--muted);margin:2px 0 0}.topbar nav{display:flex;gap:10px}.topbar nav button{border:1px solid var(--line);background:#11213a;padding:9px 14px;border-radius:9px;cursor:pointer}.topbar nav button:hover{border-color:#22d3ee88}
.hero{display:grid;grid-template-columns:286px 1fr;gap:22px;padding:24px 28px 18px;max-width:1600px;margin:auto}.recordPanel{min-height:342px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}.status{color:var(--muted);font-size:13px;border:1px solid var(--line);padding:5px 12px;border-radius:99px}.status i{display:inline-block;width:8px;height:8px;background:var(--mint);border-radius:50%;margin-right:7px}.status.live i{background:#fb3e55;animation:blink 1s infinite}.timer{font-size:38px;letter-spacing:.04em}.mic{width:132px;height:132px;border-radius:50%;border:2px solid #79eaff;background:linear-gradient(145deg,#3addf0,#0bb6d5);font-size:55px;display:grid;place-items:center;cursor:pointer;box-shadow:0 0 0 9px #22d3ee14,0 0 0 18px #22d3ee0a,0 0 38px #22d3ee55;transition:.2s}.mic:hover{transform:scale(1.03)}.mic.active{animation:pulse 1.8s infinite}.primary{border:1px solid #22d3eeaa;background:#0c2947;border-radius:9px;padding:11px 20px;font-weight:700;cursor:pointer}.primary:hover{background:#123a60}.primary:disabled{opacity:.65;cursor:wait}.recordPanel small{color:var(--muted);font-size:11px}
.speechPanel{display:flex;flex-direction:column;min-width:0}.wave{height:100px;display:flex;align-items:center;justify-content:center;gap:4px;padding:0 20px}.wave span{width:3px;border-radius:5px;background:linear-gradient(var(--lav),var(--cyan));box-shadow:0 0 8px #22d3ee77;transition:height .12s}.transcript,.card{background:linear-gradient(135deg,rgba(19,42,73,.96),rgba(12,31,57,.96));border:1px solid var(--line);border-radius:13px;box-shadow:0 14px 40px #0004}.transcript{min-height:230px;padding:22px 25px;border-color:#22d3ee55}.panelTitle{display:flex;justify-content:space-between;color:var(--muted);font-size:13px}.panelTitle b{font-size:11px;border:1px solid var(--line);padding:4px 8px;border-radius:5px}.transcript p{font-size:25px;line-height:1.55;margin:28px 0 0;font-weight:550}.transcript p.placeholder{color:#718099;font-size:18px;font-weight:400}.transcript em{color:var(--cyan)}
.transcript textarea{width:100%;min-height:130px;margin-top:18px;padding:14px 16px;border:1px solid #22d3ee55;border-radius:9px;background:#07182c;color:var(--text);font-size:21px;line-height:1.55;resize:vertical;outline:none}.transcript textarea:focus{border-color:var(--cyan);box-shadow:0 0 0 3px #22d3ee18}.reviewHint{display:block;color:var(--muted);margin-top:8px}.textButton{border:0;background:transparent;color:var(--muted);font-size:12px;text-decoration:underline;cursor:pointer}
.listeningMessage{min-height:155px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);text-align:center}.listeningMessage i{width:12px;height:12px;border-radius:50%;background:var(--cyan);box-shadow:0 0 0 0 #22d3ee66;animation:listeningPulse 1.5s infinite;margin-bottom:16px}.listeningMessage strong{color:var(--text);font-size:19px}.listeningMessage small{margin-top:8px}
.error{margin:0 28px 14px;padding:11px 15px;border:1px solid #fb7185aa;background:#4b1323aa;border-radius:9px;color:#fecdd3}.cards{display:grid;grid-template-columns:1.05fr 1.05fr 1.05fr 1fr 1.42fr;gap:15px;padding:18px 28px 32px;max-width:1600px;margin:auto}.card{min-height:330px;padding:19px;transition:transform .2s,border-color .2s;overflow:hidden}.card:hover{transform:translateY(-2px)}.card h2{font-size:16px;margin:0 0 19px}.card p{font-size:13px;line-height:1.7;color:#d8e0ec}.card small{display:block;color:var(--muted);line-height:1.55;margin-top:5px}.good{border-color:#34d39977}.good h2,.good p::first-letter{color:var(--mint)}.issue{border-color:#fbbf2466}.issue h2{color:#ffd35c}.rewrite{border-color:#a78bfa77}.rewrite h2,.rewrite .item strong{color:#c4b5fd}.sound{border-color:#22d3ee66}.sound h2,.sound .item strong{color:var(--cyan)}.item{background:#07182c99;border:1px solid var(--line);border-radius:8px;padding:10px;margin:10px 0}.item p{margin:0}.item del{display:block;color:#91a0b8;font-size:12px}.item strong{display:block;font-size:13px;margin-top:5px}.empty{color:#718099!important;margin-top:42px}.overall{display:grid;grid-template-columns:120px 1fr;grid-template-rows:auto 1fr;gap:8px 15px}.overall h2{grid-column:1/-1}.score{--score:0deg;width:112px;height:112px;border-radius:50%;background:conic-gradient(var(--cyan) var(--score),#31435b 0);display:grid;place-items:center;position:relative}.score:before{content:"";position:absolute;inset:10px;border-radius:50%;background:#10233f}.score span{z-index:1;font-size:34px}.score small{font-size:11px}.summary strong{color:var(--mint);font-size:14px;line-height:1.5}.summary p{margin:11px 0}.overall>.empty{grid-column:1/-1}
.correctedPanel{width:calc(100% - 56px);max-width:1544px;margin:0 auto;padding:20px 25px;background:linear-gradient(135deg,#102d3d,#132348);border:1px solid #34d39977;border-radius:13px;box-shadow:0 12px 34px #0003}.correctedHeading{display:flex;justify-content:space-between;align-items:center}.correctedHeading span{display:block;color:var(--mint);font-weight:750;font-size:17px}.correctedHeading small{display:block;color:var(--muted);margin-top:3px}.correctedHeading button{border:1px solid #34d39988;border-radius:8px;background:#0b2f38;color:#baf7df;padding:9px 13px;cursor:pointer}.correctedPanel>p{font-size:21px;line-height:1.65;margin:16px 0 2px;color:#f3fff9}
.pronunciationLoading{display:flex;min-height:170px;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--muted)}.pronunciationLoading i{width:36px;height:36px;border-radius:50%;border:3px solid #22d3ee33;border-top-color:var(--cyan);animation:spin .8s linear infinite;margin-bottom:14px}.pronunciationLoading strong{color:var(--cyan);font-size:13px}.pronunciationLoading small{margin-top:8px}.sound.loading{border-color:#22d3eebb;box-shadow:0 0 28px #22d3ee16}
.modalBackdrop{position:fixed;inset:0;background:#020914cc;display:grid;place-items:center;padding:20px;z-index:20}.modal{width:min(510px,100%);background:#10233f;border:1px solid #22d3ee66;border-radius:16px;padding:28px;position:relative;box-shadow:0 24px 90px #000}.modal h2{margin-top:0}.modal p{color:var(--muted);line-height:1.65}.modal label{display:block;font-size:13px}.modal input{display:block;width:100%;margin:8px 0 16px;padding:13px;border-radius:8px;border:1px solid #48617f;background:#071426;color:white}.modal .getKeyButton{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin:18px 0 7px;padding:13px 16px;border:1px solid #22d3eeaa;border-radius:9px;background:linear-gradient(135deg,#0d3855,#12506a);color:#e9fdff;font-size:14px;font-weight:750;text-decoration:none;box-shadow:0 8px 22px #0003;transition:.2s}.modal .getKeyButton:hover{background:linear-gradient(135deg,#104766,#17627b);transform:translateY(-1px)}.modal .getKeyButton span{color:var(--cyan)}.modal .keyGuide{display:block;color:var(--muted);font-size:12px;line-height:1.55;margin:0 0 20px}.modal .privacyNote{font-size:12px;line-height:1.55;margin:16px 0 0}.close{position:absolute;right:14px;top:10px;border:0;background:transparent;font-size:27px;cursor:pointer}
@keyframes pulse{50%{box-shadow:0 0 0 16px #22d3ee15,0 0 0 28px #22d3ee08,0 0 55px #22d3ee88}}@keyframes blink{50%{opacity:.35}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes listeningPulse{70%{box-shadow:0 0 0 13px #22d3ee00}}
@media(max-width:1100px){.cards{grid-template-columns:repeat(2,1fr)}.overall{grid-column:1/-1}.card{min-height:250px}.hero{grid-template-columns:240px 1fr}}
.mobileTip{display:none}
@media(max-width:720px){body{min-height:100svh;padding-bottom:env(safe-area-inset-bottom)}.topbar{height:auto;min-height:66px;padding:11px 14px;position:sticky;top:0;z-index:10}.brand{gap:9px}.logo{width:39px;height:34px;border-radius:11px;font-size:19px}.brand h1{font-size:16px}.brand p{font-size:10px}.topbar nav button:first-child{display:none}.topbar nav button{min-height:44px;font-size:12px;padding:8px 11px}.hero{grid-template-columns:1fr;padding:12px 14px 10px;gap:8px}.recordPanel{min-height:282px;gap:9px}.status{font-size:12px}.timer{font-size:32px}.mic{width:112px;height:112px;font-size:46px}.primary{min-height:48px;width:min(280px,90%);padding:12px 16px}.mobileTip{display:block!important;max-width:280px;text-align:center;line-height:1.5}.speechPanel{min-height:238px}.wave{height:52px;gap:3px;padding:0 6px}.wave span{width:2px}.transcript{min-height:185px;padding:17px}.transcript p{font-size:18px;margin-top:21px}.transcript textarea{font-size:17px;min-height:120px}.listeningMessage{min-height:120px}.listeningMessage strong{font-size:17px}.error{margin:0 14px 12px;font-size:13px}.correctedPanel{width:calc(100% - 28px);padding:17px;margin:8px auto}.correctedHeading{align-items:flex-start;gap:10px}.correctedHeading span{font-size:16px}.correctedHeading button{min-height:44px;white-space:nowrap;padding:8px 10px;font-size:12px}.correctedPanel>p{font-size:18px;line-height:1.7}.cards{grid-template-columns:1fr;padding:9px 14px 24px;gap:12px}.overall{grid-column:auto}.card{min-height:auto;padding:17px}.card h2{font-size:16px}.card p,.card small{font-size:14px}.topbar nav button{font-size:12px;padding:8px}.overall{grid-template-columns:96px 1fr}.score{width:90px;height:90px}.score:before{inset:8px}.score span{font-size:28px}.modal{padding:23px 18px}.modal input{font-size:16px}}
@media(max-width:390px){.brand p{display:none}.correctedHeading{flex-direction:column}.correctedHeading button{width:100%}.overall{grid-template-columns:1fr}.score{margin:auto}.summary{text-align:left}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Always-visible Gemini setup actions */
.topbar nav{align-items:center}
.topbar nav .apiLink{display:flex;align-items:center;border:1px solid #22d3ee88;background:#0c2947;padding:9px 14px;border-radius:9px;color:#bff7ff;font-size:13px;font-weight:700;text-decoration:none;white-space:nowrap}
.topbar nav .apiLink:hover{border-color:var(--cyan);background:#123a60}
.inlineApiLink{color:var(--cyan);font-size:12px;font-weight:700;text-decoration:underline;text-underline-offset:3px}
.modal .testKey{width:100%}
.modal .keyStatus{font-size:12px;line-height:1.55;margin:12px 0 0;padding:10px 12px;border-radius:7px}
.modal .keyStatus.success{color:#bbf7d0;background:#064e3b88;border:1px solid #34d39966}
.modal .keyStatus.failure{color:#fecdd3;background:#4b132388;border:1px solid #fb718566}
@media(max-width:720px){.topbar nav .apiLink{min-height:44px;font-size:11px;padding:8px 9px}.topbar nav{gap:6px}.topbar nav button{padding:8px 9px}}
@media(max-width:470px){.topbar{align-items:flex-start}.topbar nav{flex-wrap:wrap;justify-content:flex-end}.topbar nav .apiLink{order:3}.topbar nav button:last-child{min-height:38px}.brand p{display:none}}
.mobileClear{display:none;border:0;background:transparent;color:var(--cyan);font-size:12px;font-weight:700;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:7px 10px}
@media(max-width:720px){.mobileClear{display:block;min-height:40px}}
.release{margin-left:6px;color:var(--cyan);font-weight:700}
@media(max-width:720px){.topbar{flex-wrap:wrap;gap:8px}.topbar .brand{width:100%}.topbar nav{width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.topbar nav button:first-child,.topbar nav .newPractice{display:flex!important;align-items:center;justify-content:center}.topbar nav button,.topbar nav .apiLink{width:100%;min-height:42px;justify-content:center;padding:7px 5px;font-size:10.5px;text-align:center}.topbar nav .apiLink{order:initial}}
@media(max-width:390px){.topbar nav{grid-template-columns:1.05fr 1fr 1fr}.brand p{display:block;font-size:9px}}
.browserWarning{margin:12px 28px 0;padding:12px 15px;border:1px solid #fbbf2477;border-radius:9px;background:#4a321099;color:#fde68a;font-size:13px;line-height:1.6;text-align:center}
@media(max-width:720px){.browserWarning{margin:10px 14px 0;font-size:12px;text-align:left}}

<div class="cvModal" id="cvModal"><div class="cvModalCard"><h2>Gemini API設定</h2><p>更新版29と同じAPIキーを使用します。キーはこの端末のブラウザ内だけに保存されます。</p><input id="cvApiKey" type="password" placeholder="AIza…"><div class="cvActions"><button class="cvBtn primary" id="cvSaveApi">保存</button><button class="cvBtn" id="cvCloseApi">閉じる</button></div></div></div>
<script>
(()=>{
  const $=id=>document.getElementById(id), root=$('root'), app=$('conversationApp'), launcher=$('conversationLauncher');
  const chat=$('cvChat'), status=$('cvStatus'), statusText=$('cvStatusText'), mic=$('cvMic'), hint=$('cvHint'), error=$('cvError');
  let recorder=null,chunks=[],recording=false,busy=false,conversation=[];
  const keyName='gemini-api-key';
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const showError=m=>{error.textContent='⚠ '+m;error.classList.add('show')};
  const clearError=()=>error.classList.remove('show');
  const setStatus=(t,kind='')=>{statusText.textContent=t;status.classList.toggle('recording',kind==='recording')};
  function openConversation(){speechSynthesis?.cancel();root.style.display='none';launcher.style.display='none';app.classList.add('active');window.scrollTo(0,0)}
  function closeConversation(){speechSynthesis?.cancel();app.classList.remove('active');root.style.display='';launcher.style.display='';window.scrollTo(0,0)}
  launcher.onclick=openConversation;$('cvBack').onclick=closeConversation;
  $('cvApi').onclick=()=>{$('cvApiKey').value=localStorage.getItem(keyName)||'';$('cvModal').classList.add('show')};
  $('cvCloseApi').onclick=()=>$('cvModal').classList.remove('show');
  $('cvSaveApi').onclick=()=>{const k=$('cvApiKey').value.trim();if(!k)return showError('APIキーを入力してください。');localStorage.setItem(keyName,k);$('cvModal').classList.remove('show');clearError();setStatus('APIキーを保存しました。英語で話してください。')};
  $('cvClear').onclick=()=>{conversation=[];speechSynthesis?.cancel();chat.innerHTML='<div class="cvWelcome" id="cvWelcome"><strong>新しい会話を始めます</strong><br><br>マイクを押して英語で話してください。</div>';clearError();setStatus('マイクを押して英語で話してください。')};
  const blobToBase64=blob=>new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).split(',')[1]);r.onerror=reject;r.readAsDataURL(blob)});
  async function callGemini(key,body){
    const models=['gemini-3.5-flash-lite','gemini-3.1-flash-lite','gemini-2.5-flash'];let last;
    for(const model of models){try{const c=new AbortController(),timer=setTimeout(()=>c.abort(),60000);const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(key)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:c.signal});clearTimeout(timer);if(!res.ok){last=new Error(`Gemini ${res.status}`);continue}const data=await res.json();const text=data?.candidates?.[0]?.content?.parts?.map(p=>p.text||'').join('')||'';return JSON.parse(text.replace(/^```json\s*|```$/g,'').trim())}catch(e){last=e}}
    throw last||new Error('Geminiに接続できませんでした。');
  }
  function speak(text){if(!('speechSynthesis'in window)||!text)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);const voices=speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang));u.voice=voices.find(v=>/samantha|ava|aria|jenny|google us english|premium|enhanced|natural/i.test(v.name))||voices[0]||null;u.lang=u.voice?.lang||'en-US';u.rate=Number($('cvSpeed').value);u.pitch=1;speechSynthesis.speak(u)}
  function addTurn(role,english,japanese,feedback={}){
    const welcome=$('cvWelcome');if(welcome)welcome.remove();const row=document.createElement('div');row.className='cvTurn '+(role==='ai'?'ai':'user');
    let correction='';
    if(role==='user'&&$('cvCorrectionMode').value==='brief'){
      const minimal=feedback.minimalCorrection||english,natural=feedback.naturalEnglish||minimal;
      const minimalChanged=minimal.trim()!==english.trim(),naturalChanged=natural.trim()!==minimal.trim();
      const possible=feedback.possibleIntentionEnglish&&feedback.possibleIntentionEnglish.trim()!==natural.trim();
      const auditClass=feedback.semanticAudit==='passed'?'passed':'safe';
      const auditText=feedback.semanticAudit==='passed'?'意味監査済み':'安全優先：元の意味を保持';
      correction=`<div class="cvFeedback">
        <div class="cvAudit ${auditClass}">🛡 ${auditText}${feedback.auditNote?` — ${esc(feedback.auditNote)}`:''}</div>
        <div class="cvFeedbackBlock minimal"><strong>1. Minimal Correction｜最小限の訂正</strong><p>${esc(minimal)}</p><small>${esc(feedback.minimalNote||(!minimalChanged?'文法上の重要な訂正はありません。':'元の意味を変えずに訂正しました。'))}</small></div>
        <div class="cvFeedbackBlock natural"><strong>2. Natural English｜自然な英語</strong><p>${esc(natural)}</p><small>${esc(feedback.naturalNote||(!naturalChanged?'最小限の訂正と同じ表現が自然です。':'元の意味を維持した自然な表現です。'))}</small></div>
        ${possible?`<div class="cvFeedbackBlock possible"><strong>3. Possible Meaning｜別の意図の候補</strong><p><em>If you meant ...</em> ${esc(feedback.possibleIntentionEnglish)}</p><small>${esc(feedback.possibleIntentionJapanese||'文脈から考えられる別の意図です。元の発言の訂正ではありません。')}</small></div>`:''}
        ${feedback.clarifyingQuestion?`<div class="cvClarify"><strong>意味の確認：</strong>${esc(feedback.clarifyingQuestion)}</div>`:''}
      </div>`;
    }
    row.innerHTML=`<div class="cvAvatar">${role==='ai'?'AI':'You'}</div><div class="cvBubble"><div class="cvWho">${role==='ai'?'AI PARTNER':'YOU'}</div><div class="cvEnglish">${esc(english)}</div><div class="cvJapanese">${esc(japanese)}</div>${correction}${role==='ai'?'<div class="cvBubbleActions"><button class="cvMini">🔊 もう一度聞く</button></div>':''}</div>`;
    if(role==='ai')row.querySelector('.cvMini').onclick=()=>speak(english);chat.appendChild(row);row.scrollIntoView({behavior:'smooth',block:'end'});
  }
  async function processAudio(blob){
    const key=(localStorage.getItem(keyName)||'').trim();if(!key){$('cvApi').click();throw new Error('最初にGemini APIキーを設定してください。')}
    const b64=await blobToBase64(blob), topic=$('cvTopic').value, level=$('cvLevel').value;
    const recent=conversation.slice(-8).map(x=>`${x.role}: ${x.text}`).join('\n');
    const prompt=`You are a precise English conversation partner and coach for a Japanese learner at ${level}. Topic: ${topic}. Listen to the English audio and return valid JSON only.

REQUIRED KEYS:
transcript: exact English transcription.
userTranslation: faithful natural Japanese translation of the transcript.
minimalCorrection: correct only objective grammar, word choice, and usage errors. Preserve every intended meaning. Never replace an idea with an inferred idea.
minimalNote: one short Japanese explanation. If no correction is needed, say so.
naturalEnglish: a natural version that preserves the same meaning, attitude, certainty, and time reference as the transcript. Do not add feelings or facts.
naturalNote: one short Japanese explanation of the natural phrasing.
possibleIntentionEnglish: only when context suggests a different possible intention, give it separately as a conditional alternative. Otherwise return an empty string.
possibleIntentionJapanese: explain in Japanese that this is an inferred alternative, not a correction. Otherwise return an empty string.
meaningChanged: true only if possibleIntentionEnglish expresses a meaning different from the transcript.
clarifyingQuestion: when the intended meaning is genuinely ambiguous, ask one short Japanese confirmation question. Otherwise return an empty string.
replyEnglish: a friendly 1-3 sentence English reply at ${level} that responds to what was actually said and includes one easy question.
replyTranslation: natural Japanese translation of replyEnglish.

CRITICAL RULE: Never place an inferred meaning inside minimalCorrection or naturalEnglish. For example, "I feel fine" means the speaker feels well; it must not be changed to "I'm looking forward to it." If that may be the intended meaning, put it only in possibleIntentionEnglish beginning conceptually with "If you meant ...". Distinguish correction from interpretation.

Conversation so far:\n${recent||'(first turn)'}`;
    const draft=await callGemini(key,{contents:[{parts:[{text:prompt},{inlineData:{mimeType:blob.type||'audio/webm',data:b64}}]}],generationConfig:{responseMimeType:'application/json',maxOutputTokens:2400,temperature:.25}});
    if(!draft.transcript)return draft;
    setStatus('添削案の意味が変わっていないか監査しています…');
    const auditPrompt=`You are a strict semantic auditor for English-learning corrections. Return valid JSON only. Compare the learner's exact transcript with the proposed corrections below.

EXACT TRANSCRIPT: ${draft.transcript}
PROPOSED MINIMAL: ${draft.minimalCorrection||draft.transcript}
PROPOSED NATURAL: ${draft.naturalEnglish||draft.minimalCorrection||draft.transcript}
PROPOSED POSSIBLE INTENTION: ${draft.possibleIntentionEnglish||''}

Produce these keys:
minimalCorrection: Keep the transcript unchanged unless there is an objective grammar or usage error. A grammatical choice that is merely less common is not an error. "will go" and "be going to" can express different viewpoints; never replace one with the other in Minimal unless the original is objectively ungrammatical.
minimalNote: short Japanese explanation.
naturalEnglish: It may improve flow, but must preserve propositions, emotion intensity, certainty, modality, tense viewpoint, and speaker attitude. Never change fine to great, like to love, may to will, or will to be going to. When preservation is uncertain, copy minimalCorrection.
naturalNote: short Japanese explanation.
possibleIntentionEnglish: Put every meaning-changing alternative here only. Keep or repair the proposed alternative; otherwise empty string.
possibleIntentionJapanese: clearly say it is an inferred alternative, not a correction; otherwise empty string.
clarifyingQuestion: one short Japanese question only when the speaker's intention must be confirmed; otherwise empty string.
auditPassed: true only if your returned Minimal and Natural both preserve the transcript's meaning exactly.
auditNote: one short Japanese summary of what the audit protected.

Be conservative. Preserving the learner's meaning is more important than making the English impressive.`;
    try{
      const audited=await callGemini(key,{contents:[{parts:[{text:auditPrompt}]}],generationConfig:{responseMimeType:'application/json',maxOutputTokens:1700,temperature:0}});
      return {...draft,...audited,semanticAudit:audited.auditPassed===true?'passed':'safe'};
    }catch(e){
      return {...draft,minimalCorrection:draft.transcript,naturalEnglish:draft.transcript,minimalNote:'意味監査を完了できなかったため、元の英文を保持しました。',naturalNote:'安全のため積極的な言い換えを採用していません。',possibleIntentionEnglish:'',possibleIntentionJapanese:'',clarifyingQuestion:'',semanticAudit:'safe',auditNote:'監査エラーのため原文を保護しました。'};
    }
  }
  async function start(){
    clearError();if(busy)return;try{speechSynthesis?.cancel();const stream=await navigator.mediaDevices.getUserMedia({audio:true});const preferred=MediaRecorder.isTypeSupported('audio/webm;codecs=opus')?'audio/webm;codecs=opus':'';recorder=new MediaRecorder(stream,preferred?{mimeType:preferred}:undefined);chunks=[];recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());const blob=new Blob(chunks,{type:recorder.mimeType||'audio/webm'});busy=true;mic.disabled=true;setStatus('英語を文字化し、意味を守って添削しています…');hint.textContent='少しお待ちください';try{const r=await processAudio(blob);if(!r.transcript)throw new Error('英語を聞き取れませんでした。少し長めにはっきり話してください。');addTurn('user',r.transcript,r.userTranslation,r);conversation.push({role:'user',text:r.minimalCorrection||r.transcript});addTurn('ai',r.replyEnglish,r.replyTranslation);conversation.push({role:'assistant',text:r.replyEnglish});setStatus('AIが返答しました。続けて英語で話せます。');speak(r.replyEnglish)}catch(e){showError(e.message||'処理できませんでした。');setStatus('もう一度お試しください。')}finally{busy=false;mic.disabled=false;hint.textContent='タップして次の発話を録音します'}};recorder.start();recording=true;mic.classList.add('recording');mic.textContent='■';status.classList.add('recording');setStatus('録音中です。話し終えたら停止してください。','recording');hint.textContent='タップして録音を停止します'}catch(e){showError('マイクを開始できませんでした。ブラウザのマイク許可を確認してください。');recording=false}}
  function stop(){if(recorder&&recorder.state!=='inactive')recorder.stop();recording=false;mic.classList.remove('recording');mic.textContent='🎙️';status.classList.remove('recording')}
  mic.onclick=()=>recording?stop():start();
})();
</script>

<script>
/* The analysis screen is the preserved bundle; update only its visible release label. */
(()=>{
  const setCurrentLabel=()=>document.querySelectorAll('.release').forEach(el=>{
    if(!el.textContent.includes('32')) el.textContent='更新版 32';
  });
  setCurrentLabel();
  const observer=new MutationObserver(setCurrentLabel);
  observer.observe(document.getElementById('root'),{childList:true,subtree:true});

<script>
/* v32 semantic firewall for the preserved analysis-mode bundle. */
(()=>{
  const originalFetch=window.fetch.bind(window);
  const coachMarker='You are a supportive English coach for Japanese learners.';
  const parseModelText=data=>data?.candidates?.[0]?.content?.parts?.map(p=>p.text||'').join('')||'';
  const cleanJson=text=>JSON.parse(text.replace(/^```json\s*|```$/g,'').trim());
  window.fetch=async(input,init={})=>{
    let requestBody,coachPart;
    try{
      requestBody=JSON.parse(init.body||'{}');
      for(const content of requestBody.contents||[])for(const part of content.parts||[]){
        if(typeof part.text==='string'&&part.text.includes(coachMarker))coachPart=part;
      }
    }catch(e){}
    if(!coachPart)return originalFetch(input,init);
    const transcript=(coachPart.text.split('Transcript: ').pop()||'').trim();
    coachPart.text+=`\nSEMANTIC SAFETY: correctedText must preserve the learner's exact propositions, emotion intensity, certainty, modality, tense viewpoint, and attitude. A grammatical alternative is not an error. Do not change will to be going to, fine to great, like to love, or may to will. Put stylistic alternatives only in rewrites, clearly labeled in Japanese as optional. Never infer a feeling or intention that was not spoken.`;
    const first=await originalFetch(input,{...init,body:JSON.stringify(requestBody)});
    if(!first.ok)return first;
    try{
      const payload=await first.clone().json(),draft=cleanJson(parseModelText(payload));
      const auditPrompt=`You are the final semantic auditor for an English-learning analysis. Return valid JSON only.\nEXACT TRANSCRIPT: ${transcript}\nDRAFT CORRECTED TEXT: ${draft.correctedText||transcript}\nDRAFT REWRITES: ${JSON.stringify(draft.rewrites||[])}\n\nReturn correctedText, issues, rewrites, advice, auditNote. correctedText may fix objective errors only and must preserve meaning, emotion intensity, certainty, modality, tense viewpoint, and attitude. A grammatical alternative is not an error. If uncertain, use the exact transcript. Rewrites may offer natural alternatives only when meaning is unchanged. Remove any rewrite that changes fine to great, will to be going to, like to love, may to will, or adds an unspoken intention. All explanations and auditNote must be concise Japanese. Preserve only genuinely safe corrections.`;
      const auditBody={contents:[{parts:[{text:auditPrompt}]}],generationConfig:{responseMimeType:'application/json',maxOutputTokens:1800,temperature:0}};
      const auditedResponse=await originalFetch(input,{...init,body:JSON.stringify(auditBody)});
      if(auditedResponse.ok){
        const audited=cleanJson(parseModelText(await auditedResponse.json()));
        draft.correctedText=audited.correctedText||transcript;
        if(Array.isArray(audited.issues))draft.issues=audited.issues;
        if(Array.isArray(audited.rewrites))draft.rewrites=audited.rewrites;
        if(Array.isArray(audited.advice))draft.advice=audited.advice;
        else draft.advice=[...(draft.advice||[]),audited.auditNote||'意味監査を完了しました。'];
      }else{
        draft.correctedText=transcript;draft.rewrites=[];
        draft.advice=[...(draft.advice||[]),'意味監査を完了できなかったため、添削後の英文は原文を保持しました。'];
      }
      payload.candidates[0].content.parts=[{text:JSON.stringify(draft)}];
      const headers=new Headers(first.headers);headers.delete('content-length');headers.delete('content-encoding');
      return new Response(JSON.stringify(payload),{status:first.status,statusText:first.statusText,headers});
    }catch(e){return first}
  };
})();
</script>
